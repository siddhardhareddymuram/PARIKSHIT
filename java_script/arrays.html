<!DOCTYPE html>
<html>
<head>
    <title>Arrays</title>
</head>
<body>
    <script>
       
const numbers = [10, 20, 30, 40];
console.log(numbers);



console.log(numbers[0]);
console.log(numbers[2]);



numbers[1] = 25;
console.log(numbers);




console.log(numbers.length);





// push: add at end
numbers.push(50);
console.log(numbers);

// unshift:add at beginning
numbers.unshift(5);
console.log(numbers);



// pop : remove from end
numbers.pop();
console.log(numbers);

numbers.shift();
console.log(numbers);



// for loop
for (let i = 0; i < numbers.length; i++) {
  console.log(numbers[i]);
}

// for...of loop
for (let num of numbers) {
  console.log(num);
}




const mixedArray = [1, "Hello", true, { x: 10 }];
console.log(mixedArray);




const arr1 = [1, 2, 3];
const arr2 = arr1;

arr2[0] = 100;

console.log(arr1); 
console.log(arr2); 



const a = [1, 2];
const b = [1, 2];

console.log(a === b); // false



function printArray(arr) {
  for (let value of arr) {
    console.log(value);
  }
}

printArray(numbers);




    </script>
</body>
</html>
