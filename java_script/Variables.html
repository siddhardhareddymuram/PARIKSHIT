<!DOCTYPE html>
<html>
<head>
    <title>Variables</title>
</head>
<body>
    <script>
        let variable1 = 3;
        console.log(variable1); // It is used to print the output in the console.

        let calculation = 2+2;
        console.log(calculation+2);

        let result=calculation+2;
        console.log(result);

        let message ='hello';
        console.log(message);

        variable1=5; // Changing the variable value

        variable1=variable1+1; // Incrementing the variable value by 1
        console.log(variable1);

        const variable2=3; // Constant variable
        var variable3=4; // Old way of declaring variable

        console.log(typeof variable2); // Tells the type of the variable. (number)
        
        
    </script>
</body>
</html>
